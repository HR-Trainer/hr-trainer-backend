services:
  - type: web
    name: hr-trainer-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hr-trainer-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: hr-trainer-db
    databaseName: hrtrainer
    user: hrtrainer
